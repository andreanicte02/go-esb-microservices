# Los nombres de los servicios (esb, cliente, restaurante, repartidor) son tambien
# los hostnames con los que se encuentran entre si (ESB_URL y SERVICE_URL tienen
# esos valores por defecto). En Kubernetes son los nombres de los Services.
services:

  esb:
    build: { context: ., dockerfile: esb/Dockerfile }
    ports:
      - 8085:8085

  cliente:
    build: { context: ., dockerfile: servicio-cliente/Dockerfile }
    ports:
      - 8080:8080

  restaurante:
    build: { context: ., dockerfile: servicio-restaurante/Dockerfile }
    ports:
      - 8081:8081

  repartidor:
    build: { context: ., dockerfile: servicio-repartidor/Dockerfile }
    ports:
      - 8082:8082
