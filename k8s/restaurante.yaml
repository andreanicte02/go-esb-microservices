apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurante
  namespace: esb
  labels: { app: restaurante }
spec:
  # One replica: orders are kept in memory, so a second pod would not see them.
  replicas: 1
  selector:
    matchLabels: { app: restaurante }
  template:
    metadata:
      labels: { app: restaurante }
    spec:
      containers:
        - name: restaurante
          image: esb-microservices/restaurante:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef: { name: esb-config }
          env:
            - name: SERVICE_URL # what the ESB calls: this Service's DNS name
              value: http://restaurante:8081
          # Ready only once the ESB has accepted our routes (see comun/registro.go).
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: restaurante
  namespace: esb
spec:
  selector: { app: restaurante }
  ports:
    - port: 8081
      targetPort: 8081
